<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      padding: 48px;
    }

    .reset-btn {
      background: none;
      border: 1px solid #555;
      color: #999;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      border-color: #888;
      color: #ccc;
    }

    .reset-btn:active {
      border-color: #aaa;
      color: #fff;
    }

    .count {
      font-size: 128px;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      min-width: 200px;
      text-align: center;
      user-select: none;
    }

    .steps {
      font-size: 20px;
      color: #888;
      font-variant-numeric: tabular-nums;
      user-select: none;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .add-btn {
      background-color: #4f8cff;
      color: #fff;
      border: none;
      padding: 20px 64px;
      border-radius: 12px;
      font-size: 24px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .add-btn:hover {
      background-color: #3a75e0;
    }

    .add-btn:active {
      background-color: #2a5fc0;
    }

    .subtract-btn {
      background-color: #2a2a2a;
      color: #ccc;
      border: 1px solid #444;
      padding: 12px 40px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .subtract-btn:hover {
      background-color: #333;
      border-color: #666;
      color: #fff;
    }

    .subtract-btn:active {
      background-color: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="reset-btn" onclick="reset()">Reset</button>
    <div class="count" id="count">0</div>
    <div class="steps" id="steps">0 steps</div>
    <div class="buttons">
      <button class="add-btn" onclick="add()">+ 1</button>
      <button class="subtract-btn" onclick="subtract()">- 1</button>
    </div>
  </div>

  <script>
    let count = 0;
    const display = document.getElementById('count');
    const stepsDisplay = document.getElementById('steps');

    function render() {
      display.textContent = count;
      const steps = count * 200;
      stepsDisplay.textContent = steps.toLocaleString() + ' steps';
    }

    function add() {
      count++;
      render();
    }

    function subtract() {
      count--;
      render();
    }

    function reset() {
      count = 0;
      render();
    }
  </script>
</body>
</html>
